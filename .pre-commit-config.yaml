exclude: |
  (?x)^(
    reference/.*|
    node_modules/.*|
    playwright-report/.*|
    test-results/.*|
    \.venv/.*|
    \.venv-wsl/.*|
    \.tmp/.*|
    __pycache__/.*|
    .*\.log$
  )$

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
        exclude: |
          (?x)^(
            reference/.*|
            node_modules/.*|
            playwright-report/.*|
            test-results/.*|
            package-lock\.json$
          )$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
