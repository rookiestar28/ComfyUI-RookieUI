name: CI Full Test Gate

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-full-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test-gate:
    name: Full Test Gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run full test gate
        # SECURITY: the repository wrapper includes the mandatory complete-graph advisory gate.
        run: bash scripts/run_full_tests_linux.sh

      - name: Run required current-host contract lane
        # IMPORTANT: report exact source-fixture revisions before this job can authorize publishing.
        run: .venv/bin/python scripts/run_current_host_contract_lane.py

      - name: Verify public release boundary
        # SECURITY: reject tracked internal paths and symlinks before the dependent publish job can run.
        run: .venv/bin/python scripts/check_public_release_boundary.py

  publish-node:
    name: Publish Custom Node to registry
    # SECURITY: keep publishing in this workflow and gated by successful needs; see https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idneeds
    needs: full-test-gate
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.repository == 'rookiestar28/ComfyUI-RookieUI'
      }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true

      - name: Publish validated custom node
        uses: Comfy-Org/publish-node-action@0eb6cd742945443bee7f79eeddd4f732780029a1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
